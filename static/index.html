<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F0F23">
  <title>PyWebRTCSink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg: #0F0F23;
      --fg: #F8FAFC;
      --fg-muted: #94A3B8;
      --accent: #22D3EE;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 18px;
      min-height: 100dvh;
    }

    header {
      position: fixed; top: max(16px, env(safe-area-inset-top));
      left: 0; right: 0; padding: 0 18px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    header h1 { font-size: 1rem; font-weight: 700; opacity: 0.6; letter-spacing: -0.02em; }
    .badge {
      font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
      background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--fg-muted); font-weight: 500;
    }
    .badge.live { color: var(--accent); border-color: var(--accent); }
    .badge.off  { color: var(--danger); border-color: var(--danger); }
    .badge.recon{ color: #FBBF24; border-color: #FBBF24; }

    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px; width: 100%;
    }

    .play-btn {
      width: 220px; height: 220px; border-radius: 50%;
      border: 2px solid var(--accent); background: transparent;
      color: var(--accent); cursor: pointer; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; transition: background 250ms, color 250ms, transform 200ms;
    }
    @media (max-height: 600px) { .play-btn { width: 160px; height: 160px; } }
    .play-btn:active { transform: scale(0.97); }
    .play-btn.playing { background: var(--accent); color: var(--bg); }
    .play-btn .icon { width: 56px; height: 56px; }
    .play-btn .label { font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; }

    .hint { color: var(--fg-muted); font-size: 0.85rem; text-align: center; }

    /* Controles secundarios */
    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
    }

    .ctrl-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .ctrl-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--fg);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: background 200ms, border-color 200ms, transform 150ms, color 200ms;
    }

    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn .ctrl-icon { width: 18px; height: 18px; flex-shrink: 0; }
    
    /* Estado activo / toggled */
    .ctrl-btn.active-warn {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
      color: #FCA5A5;
    }
    .ctrl-btn.active-amber {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
      color: #FCD34D;
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Keyframe pulse para Media PC */
    @keyframes pulse-amber {
      0%   { background: rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.7); }
      100% { background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.12); }
    }
    .ctrl-btn.pulse-amber { animation: pulse-amber 220ms ease-out; }

    /* Orphan fix: Media PC ocupa columna completa */
    .ctrl-row:last-child .ctrl-btn { flex: 1; }

    /* Focus */
    .play-btn:focus-visible, .ctrl-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>PyWebRTCSink</h1>
    <span id="wsBadge" class="badge off">Desconectado</span>
  </header>

  <main>
    <button id="playBtn" class="play-btn" aria-label="Iniciar">
      <svg class="icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span class="label" id="playLabel">ESCUCHAR</span>
    </button>
    <p class="hint" id="hintCtx">Toca para escuchar el audio del PC</p>

    <!-- Barra de controles -->
    <div class="controls-grid" id="controlsGrid">
      <div class="ctrl-row">
        <button id="muteBtn" class="ctrl-btn" type="button"
                aria-pressed="false" aria-label="Silenciar audio móvil">
          <svg class="ctrl-icon" id="muteIcon" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="muteLabel">Silenciar</span>
        </button>

        <button id="mediaKeyBtn" class="ctrl-btn" type="button"
                aria-label="Play/Pause en apps del PC"
                aria-busy="false">
          <svg class="ctrl-icon" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
          <span>Play/Pause PC</span>
        </button>
      </div>
    </div>
  </main>

  <!-- <audio> oculto visualmente pero activo para playback + MediaSession -->
  <audio id="outEl" style="position:absolute;width:0;height:0;border:0;overflow:hidden" playsinline></audio>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
